version: "3.9"

services:
  app:
    image: azizhk444/app:latest
    container_name: app
    environment:
      # Application configuration
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost

      # Database configuration (using RDS)
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}

      # Secrets from GitLab CI/CD
      APP_KEY: ${APP_KEY}
      DB_PASSWORD: ${DB_PASSWORD}

  nginx:
    image: azizhk444/nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - app

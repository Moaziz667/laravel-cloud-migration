# RDS Database Pipeline
# This pipeline runs only when changes are made to the rds/ folder

stages:
  - validate
  - apply
  - destroy

# Validate Terraform configuration
rds_validate:
  stage: validate
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd rds
    - terraform fmt -check || (terraform fmt && echo "Reformatted Terraform files")
    - terraform init -input=false
    - terraform validate -compact-warnings
  rules:
    - changes:
        - rds/**/*
      when: always
  tags:
    - my-vps

# Apply RDS infrastructure
rds_apply:
  stage: apply
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  needs:
    - rds_validate
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd rds
    - terraform init -input=false
    - terraform apply -auto-approve -compact-warnings
  rules:
    - changes:
        - rds/**/*
      when: always
  tags:
    - my-vps

# Manual destroy job (only on destroy branch)
rds_destroy:
  stage: destroy
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd rds
    - terraform init -input=false
    - terraform destroy -auto-approve -compact-warnings
  rules:
    - if: $CI_COMMIT_REF_NAME == "destroy"
      changes:
        - rds/**/*
      when: manual
  tags:
    - my-vps
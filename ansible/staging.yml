---
- name: Provision prerequisites on staging host
  hosts: staging
  become: true
  vars:
    deploy_user: root
    app_dir: "/root/laraops"
    nginx_port: "{{ lookup('env', 'NGINX_PORT') | default('8743', true) }}"
    php_fpm_port: "{{ lookup('env', 'PHP_FPM_PORT') | default('9874', true) }}"
  roles:
    - role: common

- name: Deploy Laravel stack to staging
  hosts: staging
  become: true
  vars:
    deploy_user: root
    app_dir: "/root/laraops"
    app_key: "{{ lookup('env', 'STAGING_APP_KEY') | default(lookup('env', 'APP_KEY'), true) }}"
    app_url: "{{ lookup('env', 'STAGING_APP_URL') }}"
    asset_url: "{{ lookup('env', 'STAGING_ASSET_URL') }}"
    db_host: "{{ lookup('env', 'STAGING_DB_HOST') }}"
    db_port: "{{ lookup('env', 'STAGING_DB_PORT') | default('3306', true) }}"
    db_name: "{{ lookup('env', 'STAGING_DB_NAME') }}"
    db_username: "{{ lookup('env', 'STAGING_DB_USERNAME') }}"
    db_password: "{{ lookup('env', 'STAGING_DB_PASSWORD') }}"
    db_root_password: "{{ lookup('env', 'STAGING_DB_ROOT_PASSWORD') }}"
    mysql_port: "{{ lookup('env', 'MYSQL_PORT') | default('3847', true) }}"
    nginx_port: "{{ lookup('env', 'NGINX_PORT') | default('8743', true) }}"
    php_fpm_port: "{{ lookup('env', 'PHP_FPM_PORT') | default('9874', true) }}"
    php_image: "{{ lookup('env', 'PHP_IMAGE') }}"
    nginx_image: "{{ lookup('env', 'NGINX_IMAGE') }}"
    docker_username: "{{ lookup('env', 'DOCKER_USERNAME') }}"
    docker_password: "{{ lookup('env', 'DOCKER_PASSWORD') }}"
    docker_registry: "{{ lookup('env', 'DOCKER_REGISTRY') | default('docker.io', true) }}"
  roles:
    - role: deploy

---
- name: Provision prerequisites on staging host
  hosts: staging
  become: true
  vars:
    deploy_user: "{{ lookup('env', 'STAGING_DEPLOY_USER') | default(lookup('env', 'DEPLOY_USER'), true) | default('deploy', true) }}"
    app_dir: "/home/{{ deploy_user }}/laraops"
  roles:
    - role: common

- name: Deploy Laravel stack to staging
  hosts: staging
  become: true
  vars:
    deploy_user: "{{ lookup('env', 'STAGING_DEPLOY_USER') | default(lookup('env', 'DEPLOY_USER'), true) | default('deploy', true) }}"
    app_dir: "/home/{{ deploy_user }}/laraops"
    app_key: "{{ lookup('env', 'STAGING_APP_KEY') | default(lookup('env', 'APP_KEY'), true) }}"
    app_url: "{{ lookup('env', 'STAGING_APP_URL') | default(lookup('env', 'APP_URL'), true) }}"
    asset_url: "{{ lookup('env', 'STAGING_ASSET_URL') | default(lookup('env', 'ASSET_URL'), true) }}"
    db_host: "{{ lookup('env', 'STAGING_DB_HOST') | default(lookup('env', 'DB_HOST'), true) }}"
    db_port: "{{ lookup('env', 'STAGING_DB_PORT') | default(lookup('env', 'DB_PORT'), true) | default('3306', true) }}"
    db_name: "{{ lookup('env', 'STAGING_DB_NAME') | default(lookup('env', 'DB_DATABASE'), true) }}"
    db_username: "{{ lookup('env', 'STAGING_DB_USERNAME') | default(lookup('env', 'DB_USERNAME'), true) }}"
    db_password: "{{ lookup('env', 'STAGING_DB_PASSWORD') | default(lookup('env', 'DB_PASSWORD'), true) }}"
  roles:
    - role: deploy

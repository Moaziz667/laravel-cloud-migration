---
- name: Create application directory
  become: true
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0755'

- name: Create docker-compose for staging with custom ports
  become: true
  ansible.builtin.template:
    src: docker-compose.staging.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0644'

- name: Render runtime env file
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0640'

- name: Log into Docker registry
  become: true
  community.docker.docker_login:
    username: "{{ docker_username }}"
    password: "{{ docker_password }}"
    registry_url: "{{ docker_registry }}"

- name: Remove old containers and volumes
  become: true
  ansible.builtin.shell: |
    docker stop app nginx mysql 2>/dev/null || true
    docker rm app nginx mysql 2>/dev/null || true
  args:
    chdir: "{{ app_dir }}"
  ignore_errors: true

- name: Pull latest images
  become: true
  ansible.builtin.shell: |
    docker-compose pull
  args:
    chdir: "{{ app_dir }}"

- name: Start containers with docker-compose
  become: true
  ansible.builtin.shell: |
    docker-compose up -d
  args:
    chdir: "{{ app_dir }}"
  register: compose_result

- name: Show docker-compose output
  ansible.builtin.debug:
    var: compose_result.stdout_lines

- name: Wait for containers to be ready
  ansible.builtin.pause:
    seconds: 10

# 🔥🔥🔥 Ajout ici : attendre que MySQL soit réellement opérationnel
- name: Wait for MySQL to be ready
  become: true
  ansible.builtin.shell: |
    docker exec app bash -c "until nc -z {{ db_host | default('mysql') }} 3306; do echo 'Waiting for MySQL...'; sleep 2; done"
  args:
    chdir: "{{ app_dir }}"
  retries: 15
  delay: 2
  register: mysql_ready
  until: mysql_ready.rc == 0
# 🔥🔥🔥 Fin ajout

- name: Copy assets from app to nginx container
  become: true
  ansible.builtin.shell: |
    rm -rf /tmp/staging_assets
    mkdir -p /tmp/staging_assets
    docker cp app:/var/www/html/public/. /tmp/staging_assets/
    docker exec nginx mkdir -p /var/www/html/public
    docker cp /tmp/staging_assets/. nginx:/var/www/html/public/
  args:
    chdir: "{{ app_dir }}"

- name: Clear Laravel caches
  become: true
  ansible.builtin.shell: |
    docker exec app php artisan config:clear
    docker exec app php artisan cache:clear
    docker exec app php artisan view:clear
    docker exec app php artisan route:clear
  args:
    chdir: "{{ app_dir }}"

- name: Run database migrations
  become: true
  ansible.builtin.shell: docker exec app php artisan migrate --force
  args:
    chdir: "{{ app_dir }}"
  register: migrate_result
  failed_when: migrate_result.rc not in [0]

- name: Create storage link
  become: true
  ansible.builtin.shell: docker exec app php artisan storage:link
  args:
    chdir: "{{ app_dir }}"
  ignore_errors: true

- name: Cache Laravel configurations
  become: true
  ansible.builtin.shell: |
    docker exec app php artisan config:cache
    docker exec app php artisan route:cache
    docker exec app php artisan view:cache
  args:
    chdir: "{{ app_dir }}"

- name: Fix permissions
  become: true
  ansible.builtin.shell: |
    docker exec app chown -R www-data:www-data /var/www/html/public
    docker exec app chmod -R 755 /var/www/html/public
  args:
    chdir: "{{ app_dir }}"

- name: Restart nginx
  become: true
  ansible.builtin.shell: docker restart nginx
  args:
    chdir: "{{ app_dir }}"

- name: Display deployment info
  ansible.builtin.debug:
    msg: "Staging deployment completed! Access your app at: {{ app_url }}"

---
- name: Create application directory
  become: true
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0755'

- name: Create docker-compose for staging with custom ports
  become: true
  ansible.builtin.template:
    src: docker-compose.staging.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0644'

- name: Render runtime env file
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0640'

- name: Log into Docker registry
  become: true
  community.docker.docker_login:
    username: "{{ docker_username }}"
    password: "{{ docker_password }}"
    registry_url: "{{ docker_registry }}"

- name: Remove old containers and volumes
  become: true
  ansible.builtin.shell: |
    docker ps -aq --filter "name=app" | xargs -r docker stop
    docker ps -aq --filter "name=app" | xargs -r docker rm -f
    docker ps -aq --filter "name=nginx" | xargs -r docker stop
    docker ps -aq --filter "name=nginx" | xargs -r docker rm -f
    docker ps -aq --filter "name=mysql" | xargs -r docker stop
    docker ps -aq --filter "name=mysql" | xargs -r docker rm -f
  args:
    chdir: "{{ app_dir }}"
  ignore_errors: true

- name: Pull latest images
  become: true
  ansible.builtin.shell: |
    docker-compose pull
  args:
    chdir: "{{ app_dir }}"

- name: Start containers with docker-compose
  become: true
  ansible.builtin.shell: |
    docker-compose up -d
  args:
    chdir: "{{ app_dir }}"
  register: compose_result

- name: Show docker-compose output
  ansible.builtin.debug:
    var: compose_result.stdout_lines

- name: Wait for containers to be ready
  ansible.builtin.pause:
    seconds: 10

- name: Wait for MySQL to be ready
  become: true
  ansible.builtin.shell: |
    for i in {1..30}; do
      if docker exec mysql mysqladmin ping -h localhost --silent; then
        echo "MySQL is ready"
        exit 0
      fi
      echo "Waiting for MySQL... ($i/30)"
      sleep 2
    done
    exit 1
  args:
    chdir: "{{ app_dir }}"
  register: mysql_ready
  failed_when: mysql_ready.rc != 0

- name: Grant MySQL user permissions from any host
  become: true
  ansible.builtin.shell: |
    docker exec mysql bash -c "mysql -uroot -p\${MYSQL_ROOT_PASSWORD} -e \"
    CREATE USER IF NOT EXISTS '{{ db_username }}'@'%' IDENTIFIED BY '{{ db_password }}';
    GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_username }}'@'%';
    FLUSH PRIVILEGES;
    \""
  args:
    chdir: "{{ app_dir }}"
  register: grant_result
  failed_when: grant_result.rc != 0 and 'Operation CREATE USER failed' not in grant_result.stderr
  changed_when: grant_result.rc == 0

- name: Copy assets from app to nginx container
  become: true
  ansible.builtin.shell: |
    rm -rf /tmp/staging_assets
    mkdir -p /tmp/staging_assets
    docker cp app:/var/www/html/public/. /tmp/staging_assets/
    docker exec nginx mkdir -p /var/www/html/public
    docker cp /tmp/staging_assets/. nginx:/var/www/html/public/
  args:
    chdir: "{{ app_dir }}"

- name: Clear Laravel caches
  become: true
  ansible.builtin.shell: |
    docker exec app php artisan config:clear
    docker exec app php artisan cache:clear
    docker exec app php artisan view:clear
    docker exec app php artisan route:clear
  args:
    chdir: "{{ app_dir }}"

- name: Run database migrations
  become: true
  ansible.builtin.shell: docker exec app php artisan migrate --force
  args:
    chdir: "{{ app_dir }}"
  register: migrate_result
  failed_when: migrate_result.rc not in [0]

- name: Create storage link
  become: true
  ansible.builtin.shell: docker exec app php artisan storage:link
  args:
    chdir: "{{ app_dir }}"
  ignore_errors: true

- name: Cache Laravel configurations
  become: true
  ansible.builtin.shell: |
    docker exec app php artisan config:cache
    docker exec app php artisan route:cache
    docker exec app php artisan view:cache
  args:
    chdir: "{{ app_dir }}"

- name: Fix permissions
  become: true
  ansible.builtin.shell: |
    docker exec app chown -R www-data:www-data /var/www/html/public
    docker exec app chmod -R 755 /var/www/html/public
  args:
    chdir: "{{ app_dir }}"

- name: Restart nginx
  become: true
  ansible.builtin.shell: docker restart nginx
  args:
    chdir: "{{ app_dir }}"

- name: Display deployment info
  ansible.builtin.debug:
    msg: "Staging deployment completed! Access your app at: {{ app_url }}"

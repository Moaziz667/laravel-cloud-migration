---
- name: Create application directory
  become: true
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0755'

- name: Copy docker-compose file
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0644'

- name: Copy env template
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../.env.template"
    dest: "{{ app_dir }}/.env.template"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0640'

- name: Render runtime env file
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: docker
    mode: '0640'

- name: Pull containers
  become: true
  community.docker.docker_compose:
    project_src: "{{ app_dir }}"
    pull: true
    state: present

- name: Run database migrations
  become: true
  ansible.builtin.command:
    cmd: docker compose exec app php artisan migrate --force
    chdir: "{{ app_dir }}"
  register: migrate_result
  failed_when: migrate_result.rc not in [0]
  changed_when: "Migrating" in migrate_result.stdout

- name: Clear caches
  become: true
  ansible.builtin.command:
    cmd: docker compose exec app php artisan optimize:clear
    chdir: "{{ app_dir }}"

- name: Restart services
  become: true
  community.docker.docker_compose:
    project_src: "{{ app_dir }}"
    state: restarted

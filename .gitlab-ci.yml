image: docker:24.0

services:
  - docker:dind

# Include GitLab SAST template
include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: 1
  DOCKER_API_VERSION: "1.44"

  # Use commit SHA for immutable tags
  PHP_IMAGE: azizhk444/app:${CI_COMMIT_SHA}
  NGINX_IMAGE: azizhk444/nginx:${CI_COMMIT_SHA}
  # Convenience "latest" tag
  PHP_IMAGE_LATEST: azizhk444/app:latest
  NGINX_IMAGE_LATEST: azizhk444/nginx:latest

  # Docker Hub credentials must be stored in CI variables (DOCKER_USERNAME / DOCKER_PASSWORD)
  DOCKER_REGISTRY: docker.io

stages:
  - build
  - test
  - database
  - staging_deploy
  - prod_infra
  - prod_deploy
  - destroy

# ----------------------------
# PHPUnit Tests
# ----------------------------
test_php:
  stage: test
  image: ${PHP_IMAGE_LATEST}
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: testing_root
    MYSQL_DATABASE: testing
    MYSQL_USER: testing_user
    MYSQL_PASSWORD: testing_pass
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: testing
    DB_USERNAME: testing_user
    DB_PASSWORD: testing_pass
  before_script:
    - cp .env.example .env || true
    - php artisan key:generate --force
    - |
      echo "Waiting for MySQL..."
      for i in $(seq 1 30); do
        php -r "try { new PDO('mysql:host=mysql;dbname=testing', 'testing_user', 'testing_pass'); echo 'Connected!'; exit(0); } catch (Exception \$e) { sleep(2); }" && break
        echo "Attempt $i/30..."
      done
  script:
    - php artisan config:clear
    - php artisan migrate --force
    - php artisan test --parallel
  needs:
    - build_php
  only:
    - main
    - merge_requests
  tags:
    - my-vps
  allow_failure: false

# ----------------------------
# Build PHP image (decoupled)
# ----------------------------
build_php:
  stage: build
  image: docker:24.0
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - set -e
    # Try to pull previous image to use as cache
    - docker pull ${PHP_IMAGE_LATEST} || true
    - docker build --cache-from ${PHP_IMAGE_LATEST} --build-arg BUILDKIT_INLINE_CACHE=1 -t ${PHP_IMAGE} -f php.dockerfile .
    - docker push ${PHP_IMAGE}
    # Tag and push latest convenience tag
    - docker tag ${PHP_IMAGE} ${PHP_IMAGE_LATEST}
    - docker push ${PHP_IMAGE_LATEST}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-php
    paths:
      - .docker-cache/php
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Build Nginx image (decoupled)
# ----------------------------
build_nginx:
  stage: build
  image: docker:24.0
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - set -e
    - docker pull ${NGINX_IMAGE_LATEST} || true
    - docker build --cache-from ${NGINX_IMAGE_LATEST} --build-arg BUILDKIT_INLINE_CACHE=1 -t ${NGINX_IMAGE} -f nginx/nginx.dockerfile .
    - docker push ${NGINX_IMAGE}
    - docker tag ${NGINX_IMAGE} ${NGINX_IMAGE_LATEST}
    - docker push ${NGINX_IMAGE_LATEST}
  cache:
    key: ${CI_COMMIT_REF_SLUG}-nginx
    paths:
      - .docker-cache/nginx
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Database (RDS) Pipeline
# ----------------------------
rds_deploy:
  stage: database
  trigger:
    include:
      - local: rds/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - rds/**/*
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always

# ----------------------------
# Staging Deploy (VPS)
# ----------------------------
deploy_staging:
  stage: staging_deploy
  image: python:3.11-slim
  
  variables:
    SSH_HOST: "185.44.67.203"  # VPS IP address
    SSH_USER: "root"           # SSH user
    SSH_PORT: "51821"          # Custom SSH port
    NGINX_PORT: "8743"         # Non-standard Nginx port
    PHP_FPM_PORT: "9874"       # Non-standard PHP-FPM port
    MYSQL_PORT: "3847"         # Non-standard MySQL port
  
  before_script:
    - set -e
    - apt-get update && apt-get install -y openssh-client
    - python -m pip install --upgrade pip
    - pip install "ansible==8.7.0" docker
    - ansible-galaxy collection install community.docker
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - set +x
    - echo "$SSH_VPS" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - set -x
    - ssh-keyscan -p ${SSH_PORT} ${SSH_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - printf "[staging]\n%s ansible_user=%s ansible_port=%s ansible_ssh_private_key_file=~/.ssh/id_rsa\n" "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ansible/inventory/staging.ini
    - export STAGING_DB_HOST=${STAGING_DB_HOST:-mysql}
    - export STAGING_DB_PORT=${STAGING_DB_PORT:-3306}
    - export STAGING_DB_NAME=${STAGING_DB_NAME:-laravel_staging}
    - export STAGING_DB_USERNAME=${STAGING_DB_USERNAME:-laravel_user}
    - export STAGING_DB_PASSWORD=${STAGING_DB_PASSWORD:-$(openssl rand -base64 32)}
    - export STAGING_DB_ROOT_PASSWORD=${STAGING_DB_ROOT_PASSWORD:-$(openssl rand -base64 32)}
    - export STAGING_APP_KEY=${STAGING_APP_KEY:-$APP_KEY}
    - export STAGING_APP_URL="http://${SSH_HOST}:${NGINX_PORT}"
    - export STAGING_ASSET_URL="http://${SSH_HOST}:${NGINX_PORT}"
  
  script:
    - ansible-playbook -i ansible/inventory/staging.ini ansible/staging.yml
  
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Terraform: validate & fmt
# ----------------------------
prod_infra_validate:
  stage: prod_infra
  image:
    name: hashicorp/terraform:light
    entrypoint: [""] 
  needs:
    - job: build_php
    - job: build_nginx
    - job: rds_deploy
      optional: true
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd infra
    - terraform fmt -check || (terraform fmt && echo "Reformatted Terraform files")
    - terraform init -input=false
    - terraform validate
  only:
    - main
  tags:
    - my-vps

prod_infra_apply:
  stage: prod_infra
  image:
    name: hashicorp/terraform:light
    entrypoint: [""] 
  needs:
    - job: prod_infra_validate
    - job: rds_deploy
      optional: true
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd infra
    - terraform init -input=false
    - terraform apply -auto-approve
    - terraform output -raw ec2_public_ip > ../ec2_ip.txt
    - terraform output -raw db_endpoint > ../db_endpoint.txt
    - terraform output -raw db_username > ../db_username.txt  
    - terraform output -raw db_password > ../db_password.txt
    - terraform output -raw db_name > ../db_name.txt
  artifacts:
    paths:
      - ec2_ip.txt
      - db_endpoint.txt
      - db_username.txt
      - db_password.txt
      - db_name.txt
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Production Deploy (EC2 via Ansible)
# ----------------------------
prod_app_deploy:
  stage: prod_deploy
  image: python:3.11-slim
  before_script:
    - set -e
    - apt-get update && apt-get install -y openssh-client
    - python -m pip install --upgrade pip
    - pip install "ansible==8.7.0" docker
    - ansible-galaxy collection install community.docker
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - set +x
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - set -x
    - export EC2_IP=$(cat ec2_ip.txt)
    - ssh-keyscan ${EC2_IP} >> ~/.ssh/known_hosts 2>/dev/null || true
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - printf "[production]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa\n" "$EC2_IP" > ansible/inventory/production.ini
    - export DB_HOST=$(cat db_endpoint.txt)
    - export DB_USERNAME=$(cat db_username.txt)
    - export DB_PASSWORD=$(cat db_password.txt)
    - export DB_DATABASE=$(cat db_name.txt)
    - export DB_PORT=${DB_PORT:-3306}
    - export APP_URL="http://${EC2_IP}"
    - export ASSET_URL="http://${EC2_IP}"
  script:
    - ansible-playbook -i ansible/inventory/production.ini ansible/production.yml
  needs:
    - prod_infra_apply
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Destroy infra (manual)
# ----------------------------
prod_infra_destroy:
  stage: destroy
  image:
    name: hashicorp/terraform:light
    entrypoint: [""] 
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd infra
    - terraform init -input=false
    - terraform destroy -auto-approve
  only:
    - destroy
  when: manual
  tags:
    - my-vps


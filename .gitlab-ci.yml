deploy_app:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh sshpass curl docker-compose
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - export EC2_IP="51.21.248.38"  # Hard-coded for quick testing
    - export DB_HOST=$(echo "$DB_HOST_OVERRIDE")
    - export DB_USERNAME=$(echo "$DB_USERNAME_OVERRIDE") 
    - export DB_PASSWORD=$(echo "$DB_PASSWORD_OVERRIDE")
    - export DB_DATABASE=$(echo "$DB_DATABASE_OVERRIDE")

    # Prepare EC2 for Docker
    - |
      ssh ubuntu@$EC2_IP "
        sudo apt update -y &&
        sudo apt install -y docker.io &&
        sudo systemctl start docker &&
        sudo usermod -aG docker ubuntu &&
        sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m) -o /usr/local/bin/docker-compose &&
        sudo chmod +x /usr/local/bin/docker-compose
      "

    # Upload config files
    - scp docker-compose.yml .env.template ubuntu@$EC2_IP:/home/ubuntu/

    # Generate .env and deploy containers
    - |
      ssh ubuntu@$EC2_IP "
        export APP_KEY='$APP_KEY'
        export DB_HOST='$DB_HOST'
        export DB_DATABASE='$DB_DATABASE'
        export DB_USERNAME='$DB_USERNAME'
        export DB_PASSWORD='$DB_PASSWORD'
        export APP_URL='http://$EC2_IP'
        export ASSET_URL='http://$EC2_IP'
        export MIX_APP_URL='http://$EC2_IP'

        envsubst < /home/ubuntu/.env.template > /home/ubuntu/.env
        
        # Debug: Check what IP we're using
        echo 'EC2_IP is:' '$EC2_IP'
        echo 'Generated .env contents:'
        cat /home/ubuntu/.env | grep -E 'APP_URL|ASSET_URL'

        cd /home/ubuntu
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
        docker-compose down
        docker-compose pull
        docker-compose up -d --remove-orphans

        sleep 30
        
        # Check if assets exist before running app commands
        docker exec app ls -la /var/www/html/public/frontend/
        docker exec app ls -la /var/www/html/public/frontend/css/
        docker exec app ls -la /var/www/html/public/frontend/js/
        docker exec app ls -la /var/www/html/public/frontend/images/
        
        # FIX: Copy frontend assets from app container to nginx container
        echo 'Copying frontend assets from app to nginx container...'
        sudo rm -rf /tmp/shared_assets
        sudo mkdir -p /tmp/shared_assets
        sudo chmod 777 /tmp/shared_assets

        docker cp app:/var/www/html/public/frontend /tmp/shared_assets/ || echo 'Frontend copy to host failed'
        docker cp app:/var/www/html/public/images /tmp/shared_assets/ || echo 'Images copy to host failed'
        docker cp app:/var/www/html/public/css /tmp/shared_assets/ || echo 'CSS copy to host failed'
        docker cp app:/var/www/html/public/js /tmp/shared_assets/ || echo 'JS copy to host failed'

        sudo docker exec nginx mkdir -p /var/www/html/public
        sudo docker exec nginx rm -rf /var/www/html/public/frontend /var/www/html/public/images /var/www/html/public/css /var/www/html/public/js || true

        sudo docker cp /tmp/shared_assets/frontend nginx:/var/www/html/public/ || echo 'Frontend copy to nginx failed'
        sudo docker cp /tmp/shared_assets/images nginx:/var/www/html/public/ || echo 'Images copy to nginx failed'
        sudo docker cp /tmp/shared_assets/css nginx:/var/www/html/public/ || echo 'CSS copy to nginx failed'
        sudo docker cp /tmp/shared_assets/js nginx:/var/www/html/public/ || echo 'JS copy to nginx failed'

        sudo rm -rf /tmp/shared_assets
        
        # Fix permissions on nginx container
        docker exec nginx chown -R nginx:nginx /var/www/html/public || true
        docker exec nginx chmod -R 755 /var/www/html/public || true
        
        # Verify assets are now accessible in nginx
        echo 'Checking if nginx can see frontend assets:'
        docker exec nginx ls -la /var/www/html/public/frontend/css/ || echo 'No frontend/css in nginx'
        docker exec nginx ls -la /var/www/html/public/ || echo 'No public dir in nginx'
        
        # Test direct nginx access to CSS
        docker exec nginx cat /var/www/html/public/frontend/css/style.css | head -5 || echo 'Cannot read CSS from nginx'
        docker exec nginx curl -I http://localhost/frontend/css/style.css || echo 'Nginx cannot serve CSS'
        
        echo 'Assets copy verification completed!'
        
        # Run Laravel commands with forced config clearing
        docker exec app php artisan config:clear
        docker exec app php artisan cache:clear
        docker exec app php artisan view:clear
        docker exec app php artisan route:clear
        docker exec app php artisan migrate --force
        docker exec app php artisan storage:link || echo 'Storage link already exists'
        docker exec app php artisan config:cache
        docker exec app php artisan route:cache
        docker exec app php artisan view:cache
        
        # Fix permissions for assets
        docker exec app chown -R www-data:www-data /var/www/html/public
        docker exec app chmod -R 755 /var/www/html/public
        
        # Test that Nginx can serve static files
        docker exec nginx nginx -t
        docker restart nginx || echo 'Nginx restart failed'
        
        # Wait for services to be ready
        sleep 10
        
        echo 'Deployment completed successfully!'
      "
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_MESSAGE =~ /\[deploy-only\]/'
      when: always
  tags:
    - my-vps

# Quick deploy job for testing (skips everything else)
quick_deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh sshpass curl docker-compose
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - export EC2_IP="51.21.248.38"
    - |
      ssh ubuntu@$EC2_IP "
        cd /home/ubuntu
        docker-compose down
        docker-compose pull
        docker-compose up -d --remove-orphans
        sleep 20
        
        # Copy assets using host as intermediary to avoid container-to-container restriction
        echo 'Setting up shared asset directory...'
        sudo rm -rf /tmp/shared_assets
        sudo mkdir -p /tmp/shared_assets
        sudo chmod 777 /tmp/shared_assets

        docker cp app:/var/www/html/public/frontend /tmp/shared_assets/ || echo 'Frontend copy to host failed'
        docker cp app:/var/www/html/public/images /tmp/shared_assets/ || echo 'Images copy to host failed'
        docker cp app:/var/www/html/public/css /tmp/shared_assets/ || echo 'CSS copy to host failed'
        docker cp app:/var/www/html/public/js /tmp/shared_assets/ || echo 'JS copy to host failed'

        sudo docker exec nginx mkdir -p /var/www/html/public
        sudo docker exec nginx rm -rf /var/www/html/public/frontend /var/www/html/public/images /var/www/html/public/css /var/www/html/public/js || true

        sudo docker cp /tmp/shared_assets/frontend nginx:/var/www/html/public/ || echo 'Frontend copy to nginx failed'
        sudo docker cp /tmp/shared_assets/images nginx:/var/www/html/public/ || echo 'Images copy to nginx failed'
        sudo docker cp /tmp/shared_assets/css nginx:/var/www/html/public/ || echo 'CSS copy to nginx failed'
        sudo docker cp /tmp/shared_assets/js nginx:/var/www/html/public/ || echo 'JS copy to nginx failed'

        sudo rm -rf /tmp/shared_assets
        
        # Fix permissions
        docker exec nginx chown -R nginx:nginx /var/www/html/public || true
        docker exec nginx chmod -R 755 /var/www/html/public || true
        
        # Verify
        docker exec nginx ls -la /var/www/html/public/frontend/css/ || echo 'CSS not found'
        docker exec nginx curl -I http://localhost/frontend/css/style.css || echo 'Nginx cannot serve CSS'
        
        echo 'Quick deploy completed!'
      "
  only:
    - main  
  tags:
    - my-vps



# ----------------------------
# Destroy infra (manual)
# ----------------------------
terraform_destroy:
  stage: destroy
  image:
    name: hashicorp/terraform:light
    entrypoint: [""] 
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - set -e
    - cd infra
    - terraform init -input=false
    - terraform destroy -auto-approve
  only:
    - destroy
  when: manual
  tags:
    - my-vps


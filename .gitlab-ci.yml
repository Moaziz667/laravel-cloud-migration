image: docker:24.0

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: 1
  PHP_IMAGE: azizhk444/app
  NGINX_IMAGE: azizhk444/nginx
  MYSQL_IMAGE: mysql:8.0

stages:
  - build
  - infrastructure
  - deploy
  - destroy

#################### Build Stage ####################
build_app:
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker pull $PHP_IMAGE || true
    - docker build --cache-from $PHP_IMAGE -t $PHP_IMAGE -f php.dockerfile .
    - docker push $PHP_IMAGE

    - docker pull $NGINX_IMAGE || true
    - docker build --cache-from $NGINX_IMAGE -t $NGINX_IMAGE -f nginx/nginx.dockerfile .
    - docker push $NGINX_IMAGE
  only:
    - main

#################### Terraform Apply ####################
terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io  # Terraform Cloud token
  script:
    - cd infra
    - terraform init
    - terraform apply -auto-approve
    - terraform output -raw k3s_node_public_ip > ../ec2_ip.txt  # Save at root, not inside 'infra'
  artifacts:
    paths:
      - ec2_ip.txt   # FIXED path
  only:
    - main
  tags:
    - my-vps

#################### Deploy Stage ####################
deploy_app:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh sshpass
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - EC2_IP=$(cat ec2_ip.txt)
    - |
      ssh -o StrictHostKeyChecking=no ubuntu@$EC2_IP <<'EOF'
        sudo apt update -y
        sudo apt install -y docker.io
        sudo systemctl start docker
        sudo usermod -aG docker ubuntu
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
      EOF


    - scp docker-compose.yml .env.template ubuntu@$EC2_IP:/home/ubuntu/

    - ssh ubuntu@$EC2_IP <<EOF
        export APP_KEY="$APP_KEY"
        export DB_PASSWORD="$DB_PASSWORD"
        export MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD"
        envsubst < /home/ubuntu/.env.template > /home/ubuntu/.env
        docker-compose -f /home/ubuntu/docker-compose.yml up -d
      EOF
  dependencies:
    - terraform_apply
  only:
    - main
  tags:
    - my-vps

#################### Destroy Infra ####################
terraform_destroy:
  stage: destroy
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - cd infra
    - terraform init
    - terraform destroy -auto-approve
  only:
    - destroy
  tags:
    - my-vps

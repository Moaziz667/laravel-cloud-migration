image: docker:24.0

services:
  - name: docker:24.0-dind

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: 1

  # Use commit SHA for immutable tags
  PHP_IMAGE: azizhk444/app:${CI_COMMIT_SHA}
  NGINX_IMAGE: azizhk444/nginx:${CI_COMMIT_SHA}

  PHP_IMAGE_LATEST: azizhk444/app:latest
  NGINX_IMAGE_LATEST: azizhk444/nginx:latest

  DOCKER_REGISTRY: docker.io

stages:
  - build
  - test
  - infrastructure
  - deploy
  - destroy

# ----------------------------
# Build PHP image
# ----------------------------
build_php:
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker pull ${PHP_IMAGE} || true
    - docker build --cache-from ${PHP_IMAGE} -t ${PHP_IMAGE} -f php.dockerfile .
    - docker push ${PHP_IMAGE}
    - docker tag ${PHP_IMAGE} ${PHP_IMAGE_LATEST}
    - docker push ${PHP_IMAGE_LATEST}
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Build Nginx image
# ----------------------------
build_nginx:
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker pull ${NGINX_IMAGE} || true
    - docker build --cache-from ${NGINX_IMAGE} -t ${NGINX_IMAGE} -f nginx/nginx.dockerfile .
    - docker push ${NGINX_IMAGE}
    - docker tag ${NGINX_IMAGE} ${NGINX_IMAGE_LATEST}
    - docker push ${NGINX_IMAGE_LATEST}
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Terraform validate
# ----------------------------
terraform_validate:
  stage: infrastructure
  image: hashicorp/terraform:light
  script:
    - cd infra
    - terraform fmt -check || terraform fmt
    - terraform init -input=false -backend=false
    - terraform validate
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Terraform apply
# ----------------------------
terraform_apply:
  stage: infrastructure
  image: hashicorp/terraform:light
  needs:
    - terraform_validate
  script:
    - cd infra
    - terraform init -input=false
    - terraform apply -auto-approve
    - terraform output -raw k3s_node_public_ip > ../ec2_ip.txt
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Deploy to EC2 (HEREDOC — FIXED)
# ----------------------------
deploy_app:
  stage: deploy
  image: alpine:latest
  needs:
    - terraform_apply
    - build_php
    - build_nginx
  before_script:
    - apk add --no-cache openssh sshpass curl docker-compose gettext
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - export EC2_IP=$(cat ec2_ip.txt)
    - echo "Deploying to $EC2_IP"

    # ------------------------
    # SSH: install docker + DOCKER LOGIN FIX
    # ------------------------
    - |
      ssh ubuntu@$EC2_IP << 'EOF'
        set -e

        sudo apt-get update -y
        sudo apt-get install -y docker.io curl

        sudo systemctl enable --now docker
        sudo usermod -aG docker ubuntu || true

        if [ ! -f /usr/local/bin/docker-compose ]; then
          sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi

        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      EOF

    # Copy docker-compose + .env template
    - scp docker-compose.yml .env.template ubuntu@$EC2_IP:/home/ubuntu/

    # Generate .env on server
    - |
      ssh ubuntu@$EC2_IP << EOF
        export APP_KEY="${APP_KEY}"
        export DB_PASSWORD="${DB_PASSWORD}"
        export MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}"
        envsubst < /home/ubuntu/.env.template > /home/ubuntu/.env
      EOF

    # ------------------------
    # Pull images and restart
    # ------------------------
    - |
      ssh ubuntu@$EC2_IP << 'EOF'
        cd /home/ubuntu
        docker-compose pull
        docker-compose up -d --remove-orphans
      EOF

    # ------------------------
    # Health check
    # ------------------------
    - |
      ssh ubuntu@$EC2_IP << 'EOF'
        echo "Waiting for app to become healthy..."
        for i in {1..40}; do
          STATUS=$(docker inspect --format='{{.State.Health.Status}}' app 2>/dev/null || echo "starting")
          if [ "$STATUS" = "healthy" ]; then
            echo "App is healthy"
            break
          fi
          sleep 5
        done
      EOF

    # ------------------------
    # Run migrations
    # ------------------------
    - |
      ssh ubuntu@$EC2_IP << 'EOF'
        docker exec app php artisan migrate --force
      EOF

  only:
    - main
  tags:
    - my-vps

# ----------------------------
# Destroy infra
# ----------------------------
terraform_destroy:
  stage: destroy
  image: hashicorp/terraform:light
  script:
    - cd infra
    - terraform init -input=false
    - terraform destroy -auto-approve
  only:
    - destroy
  when: manual
  tags:
    - my-vps
